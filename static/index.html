<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="lightbox" class="active">
        <div id="editor">
            <div class="form-container">
                <form>
                    <input type="text" id="new-quote-text" placeholder="Quote">
                    <input type="text" id="new-quote-author" placeholder="Author">
                    <button id="add-new-quote">Add quote</button>
                </form>
            </div>
            <ul class="quotes-list">
            </ul>
        </div>
    </div>
    <div id="quote-container" class="quote-container">
        <div class="quote-text">
            <span id="quote"></span>
        </div>
        <div class="quote-author">
            <span id="author"></span>
        </div>
        <div class="button-container">
            <button id="next-quote">Next Quote</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
